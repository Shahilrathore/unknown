<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Preview Board</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#16182a;--muted:#6c7090;--accent:#5b5bf0;--accent2:#c04bf0;--border:#e3e5f2;--shadow:0 6px 24px rgba(40,40,100,.08);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#191a30;--text:#eceefc;--muted:#9a9dc4;--accent:#8c8cff;--accent2:#d58bff;--border:#2a2c4a;--shadow:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:36px 20px 70px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.02em}
header p{margin:0;opacity:.9}
main{max-width:1200px;margin:-48px auto 0;padding:0 16px 56px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
textarea{width:100%;height:150px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;outline:none}
textarea:focus,input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
button{border:0;border-radius:10px;padding:10px 18px;font-size:.95rem;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:transform .15s}
button:hover{transform:translateY(-1px)}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--border)}
input[type=search]{flex:1;min-width:160px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:.95rem;outline:none}
#count{color:var(--muted);font-size:.9rem}
#bar{display:none;margin-top:22px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--border),var(--bg));position:relative;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700;color:var(--muted);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .4s}
.thumb img.ok{opacity:1}
.meta{display:flex;gap:10px;align-items:center;padding:12px 14px}
.meta img{width:22px;height:22px;border-radius:5px;flex:none}
.meta div{min-width:0}
.meta b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:99px;z-index:1}
#more{display:none;margin:26px auto 0}
.note{color:var(--muted);font-size:.82rem;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>🔗 Link Preview Board</h1>
  <p>Websites paste karo, pehle preview dekho, phir click karo</p>
</header>
<main>
  <div class="panel">
    <textarea id="inp" placeholder="Excel column yahan paste karo (har line mein ek website)&#10;example.com&#10;https://wikipedia.org"></textarea>
    <div class="row">
      <button id="go">Preview banao</button>
      <button class="alt" id="clr">Clear</button>
      <span id="count"></span>
    </div>
    <div class="note">Preview ke liye internet chahiye. Cards scroll karte hi load hote hain, isliye 3956 links par bhi page halka rehta hai.</div>
  </div>
  <div id="bar" class="row"><input type="search" id="q" placeholder="Search karo..."><span id="shown"></span></div>
  <div id="grid"></div>
  <button id="more">Aur dikhao</button>
</main>
<script>
const $=id=>document.getElementById(id);
const inp=$('inp'),grid=$('grid'),more=$('more'),bar=$('bar'),q=$('q');
const PAGE=48;let all=[],view=[],shown=0;
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;io.unobserve(e.target);
  const img=e.target.querySelector('.thumb img'),u=e.target.href;
  img.onload=()=>{if(img.naturalWidth>1)img.classList.add('ok')};
  img.src='https://s.wordpress.com/mshots/v1/'+encodeURIComponent(u)+'?w=640&h=400';
}),{rootMargin:'300px'});
function norm(s){s=s.trim().replace(/^["']|["']$/g,'');if(!s)return null;return /^[a-z][a-z0-9+.-]*:\/\//i.test(s)?s:'https://'+s}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function card(u,i){
  const a=document.createElement('a');a.className='card';a.href=u;a.target='_blank';a.rel='noopener noreferrer';
  const h=host(u);
  a.innerHTML='<div class="thumb"><span class="num"></span><span class="ph"></span><img alt="" referrerpolicy="no-referrer"></div><div class="meta"><img alt="" loading="lazy" referrerpolicy="no-referrer"><div><b></b><small></small></div></div>';
  a.querySelector('.num').textContent='#'+(i+1);
  a.querySelector('.ph').textContent=(h[0]||'?').toUpperCase();
  a.querySelector('.meta img').src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64';
  a.querySelector('b').textContent=h;a.querySelector('small').textContent=u;
  io.observe(a);return a;
}
function render(reset){
  if(reset){grid.replaceChildren();shown=0}
  const f=document.createDocumentFragment();
  view.slice(shown,shown+PAGE).forEach((u,k)=>f.appendChild(card(u,all.indexOf(u))));
  grid.appendChild(f);shown=Math.min(shown+PAGE,view.length);
  more.style.display=shown<view.length?'block':'none';
  more.textContent='Aur dikhao ('+(view.length-shown)+' bache)';
  $('shown').textContent=view.length+' links';
}
function build(){
  const seen=new Set();all=[];
  inp.value.split(/[\r\n\t]+/).map(norm).filter(Boolean).forEach(u=>{if(!seen.has(u)){seen.add(u);all.push(u)}});
  view=all;bar.style.display=all.length?'flex':'none';q.value='';
  $('count').textContent=all.length?all.length+' links mile':'';
  render(true);
}
q.oninput=()=>{const t=q.value.toLowerCase();view=t?all.filter(u=>u.toLowerCase().includes(t)):all;render(true)};
$('go').onclick=build;more.onclick=()=>render(false);
$('clr').onclick=()=>{inp.value='';all=view=[];grid.replaceChildren();bar.style.display='none';more.style.display='none';$('count').textContent=''};
</script>
</body>
</html>
